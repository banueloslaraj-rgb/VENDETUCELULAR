<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin - JL PHONE BUYBACK</title>
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
body {
    background: #0a0a0a;
    padding: 20px;
    font-family: 'Poppins', sans-serif;
}
.login-container {
    max-width: 400px;
    margin: 100px auto;
    background: #111;
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    border: 1px solid #2a2a2a;
}
.login-container h2 {
    color: #00ff88;
    margin-bottom: 20px;
}
.login-container input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    color: white;
    font-family: 'Poppins', sans-serif;
}
.login-container button {
    width: 100%;
    margin-top: 20px;
}
.admin-container {
    display: none;
    max-width: 1400px;
    margin: 0 auto;
}
</style>
</head>
<body>

<!-- Pantalla de login -->
<div id="loginPanel" class="login-container">
    <h2>🔐 Panel Administrativo</h2>
    <p style="color:#888; margin-bottom:20px;">Ingresa la contraseña de acceso</p>
    <input type="password" id="adminPassword" placeholder="Contraseña" required>
    <button onclick="loginAdmin()" class="btn-submit">Acceder al panel</button>
</div>

<!-- Panel Admin -->
<div id="adminPanel" class="admin-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px;">
        <h1 style="color: #00ff88; margin:0;">📱 JL PHONE BUYBACK - Admin</h1>
        <button onclick="logoutAdmin()" style="padding: 10px 20px; background: #ff4444; color: white; border: none; border-radius: 8px; cursor: pointer;">Cerrar sesión</button>
    </div>
    
    <div class="filtros" style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
        <button class="filtro-btn active" data-filtro="todas" style="padding: 10px 20px; background: #1a1a1a; border: 1px solid #2a2a2a; color: white; border-radius: 8px; cursor: pointer;">📋 Todas</button>
        <button class="filtro-btn" data-filtro="pendiente" style="padding: 10px 20px; background: #1a1a1a; border: 1px solid #2a2a2a; color: white; border-radius: 8px; cursor: pointer;">⏳ Pendientes</button>
        <button class="filtro-btn" data-filtro="respondida" style="padding: 10px 20px; background: #1a1a1a; border: 1px solid #2a2a2a; color: white; border-radius: 8px; cursor: pointer;">✅ Respondidas</button>
    </div>
    
    <div id="contadorPendientes" style="background:#111; padding:15px; border-radius:10px; margin-bottom:20px; text-align:center; border:1px solid #2a2a2a;">
        Cargando...
    </div>
    
    <div id="solicitudesContainer" class="solicitudes-grid">
        <div style="text-align: center; grid-column: 1/-1; color: #888;">Cargando solicitudes...</div>
    </div>
</div>

<!-- Modal para ver fotos -->
<div id="modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; justify-content:center; align-items:center;">
    <span onclick="cerrarModal()" style="position:absolute; top:20px; right:40px; color:white; font-size:40px; cursor:pointer;">&times;</span>
    <div class="modal-content">
        <img id="modalImg" src="" alt="Foto ampliada" style="max-width:90%; max-height:90%; border-radius:10px;">
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
</body>
</html>
