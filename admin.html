<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Admin - JL PHONE BUYBACK</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --primary-light: #818cf8;
    --secondary: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --dark: #1e293b;
    --darker: #0f172a;
    --light: #f8fafc;
    --gray: #64748b;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--darker);
    padding: 20px;
    font-family: 'Poppins', sans-serif;
    color: white;
}

.login-container {
    max-width: 400px;
    margin: 100px auto;
    background: rgba(30, 41, 59, 0.5);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    border: 1px solid rgba(99, 102, 241, 0.2);
    color: white;
}

.login-container h2 {
    color: var(--primary-light);
    margin-bottom: 20px;
}

.login-container input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 12px;
    color: white;
    font-family: 'Poppins', sans-serif;
}

.login-container button {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    color: white;
    border: none;
    border-radius: 50px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
}

.admin-container {
    display: none;
    max-width: 1400px;
    margin: 0 auto;
    color: white;
}

.admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    flex-wrap: wrap;
    gap: 15px;
}

.admin-header h1 {
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.filtros {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.filtro-btn {
    padding: 10px 20px;
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(99, 102, 241, 0.3);
    color: white;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s;
}

.filtro-btn:hover {
    border-color: var(--primary);
}

.filtro-btn.active {
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    color: white;
    border-color: transparent;
}

.solicitudes-grid {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.solicitud-card {
    background: rgba(30, 41, 59, 0.5);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 25px;
    border: 1px solid rgba(99, 102, 241, 0.2);
    transition: all 0.3s;
    color: white;
}

.solicitud-card:hover {
    transform: translateY(-3px);
    border-color: var(--primary);
}

.solicitud-card p {
    color: white;
}

.solicitud-card strong {
    color: white;
}

.precio-cliente {
    background: linear-gradient(135deg, var(--warning) 0%, #ea580c 100%);
    padding: 10px 15px;
    border-radius: 12px;
    display: inline-block;
    font-weight: bold;
    color: white;
}

.fotos-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 15px 0;
}

.foto-miniatura {
    width: 80px;
    height: 80px;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid rgba(99, 102, 241, 0.3);
    transition: all 0.3s;
}

.foto-miniatura:hover {
    border-color: var(--primary);
    transform: scale(1.05);
}

.foto-miniatura img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.btn-responder {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
}

.input-group {
    margin-top: 15px;
}

.input-group input,
.input-group textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 12px;
    color: white;
    font-family: 'Poppins', sans-serif;
}

.input-group input::placeholder,
.input-group textarea::placeholder {
    color: #94a3b8;
}

.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}

.modal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 20px;
}

#contadorPendientes {
    color: white;
}
</style>
</head>
<body>

<div id="loginPanel" class="login-container">
    <h2>🔐 Panel Administrativo</h2>
    <p style="color:#94a3b8; margin-bottom:20px;">Ingresa la contraseña de acceso</p>
    <input type="password" id="adminPassword" placeholder="Contraseña">
    <button id="loginBtn">Acceder al panel</button>
</div>

<div id="adminPanel" class="admin-container">
    <div class="admin-header">
        <h1>📱 JL PHONE BUYBACK - Admin</h1>
        <button id="logoutBtn" style="padding:10px 20px; background:var(--danger); color:white; border:none; border-radius:12px; cursor:pointer;">Cerrar sesión</button>
    </div>
    
    <div class="filtros">
        <button class="filtro-btn active" data-filtro="todas">📋 Todas</button>
        <button class="filtro-btn" data-filtro="pendiente">⏳ Pendientes</button>
        <button class="filtro-btn" data-filtro="respondida">✅ Respondidas</button>
    </div>
    
    <div id="contadorPendientes" style="background:rgba(30,41,59,0.5); padding:15px; border-radius:12px; margin-bottom:20px; text-align:center;">
        Cargando...
    </div>
    
    <div id="solicitudesContainer" class="solicitudes-grid"></div>
</div>

<div id="modal" class="modal" onclick="cerrarModal()">
    <img id="modalImg" src="">
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const SUPABASE_URL = 'https://yczegabspeywaaxsnnoj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljemVnYWJzcGV5d2FheHNubm9qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MDc3OTksImV4cCI6MjA5NTM4Mzc5OX0.tdVSoJTjqdwX8wyqnbdNH6mXESDPPIdC_c6bg3kKm5g';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const ADMIN_PASSWORD = 'admin123';
    
    let solicitudes = [];
    let filtroActual = 'todas';
    
    const loginPanel = document.getElementById('loginPanel');
    const adminPanel = document.getElementById('adminPanel');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const adminPassword = document.getElementById('adminPassword');
    const contadorDiv = document.getElementById('contadorPendientes');
    const solicitudesContainer = document.getElementById('solicitudesContainer');
    
    async function loginAdmin() {
        const password = adminPassword.value;
        if (password === ADMIN_PASSWORD) {
            sessionStorage.setItem('adminLoggedIn', 'true');
            await Swal.fire('Éxito', 'Bienvenido al panel', 'success');
            loginPanel.style.display = 'none';
            adminPanel.style.display = 'block';
            cargarSolicitudes();
            suscribirCambios();
        } else {
            Swal.fire('Error', 'Contraseña incorrecta', 'error');
        }
    }
    
    function logoutAdmin() {
        sessionStorage.removeItem('adminLoggedIn');
        loginPanel.style.display = 'block';
        adminPanel.style.display = 'none';
        adminPassword.value = '';
    }
    
    function checkSession() {
        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            loginPanel.style.display = 'none';
            adminPanel.style.display = 'block';
            cargarSolicitudes();
            suscribirCambios();
        }
    }
    
    function suscribirCambios() {
        supabase.channel('solicitudes_changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'solicitudes' }, () => cargarSolicitudes())
            .subscribe();
    }
    
    async function cargarSolicitudes() {
        const { data, error } = await supabase
            .from('solicitudes')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (!error && data) {
            solicitudes = data;
            actualizarContador();
            mostrarSolicitudes();
        }
    }
    
    function actualizarContador() {
        const pendientes = solicitudes.filter(s => s.estado === 'pendiente').length;
        contadorDiv.innerHTML = `<strong>📊 Resumen:</strong> ${pendientes} solicitud(es) pendiente(s) de respuesta`;
    }
    
    function mostrarSolicitudes() {
        let filtradas = solicitudes;
        if (filtroActual !== 'todas') {
            filtradas = solicitudes.filter(s => s.estado === filtroActual);
        }
        
        if (filtradas.length === 0) {
            solicitudesContainer.innerHTML = '<div style="text-align:center; color:#94a3b8;">No hay solicitudes</div>';
            return;
        }
        
        solicitudesContainer.innerHTML = filtradas.map(s => `
            <div class="solicitud-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                    <span style="color:var(--primary); font-weight:bold;">#${s.id}</span>
                    <span style="padding:4px 12px; border-radius:20px; background:${s.estado === 'pendiente' ? 'var(--warning)' : 'var(--secondary)'}; color:white;">${s.estado === 'pendiente' ? 'Pendiente' : 'Respondida'}</span>
                </div>
                <p><strong>👤 Nombre:</strong> ${s.nombre}</p>
                <p><strong>📧 Email:</strong> ${s.email}</p>
                <p><strong>📱 Teléfono:</strong> ${s.telefono}</p>
                <p><strong>📱 Equipo:</strong> ${s.marca} ${s.modelo}</p>
                <p><strong>🔧 Condición:</strong> ${s.condicion}</p>
                <p><strong>💰 Precio esperado:</strong> <span class="precio-cliente">$${parseInt(s.precio_cliente || 0).toLocaleString()} MXN</span></p>
                <p><strong>📝 Descripción:</strong> ${s.descripcion || 'Sin descripción'}</p>
                <div class="fotos-grid">
                    ${s.fotos && s.fotos.length > 0 ? s.fotos.map(f => `<div class="foto-miniatura" onclick="verFoto('${f}')"><img src="${f}"></div>`).join('') : '<p>Sin fotos</p>'}
                </div>
                ${s.estado === 'respondida' ? `
                    <div style="margin-top:15px; padding:15px; background:rgba(16,185,129,0.1); border-radius:12px;">
                        <strong>💬 Respuesta:</strong>
                        <p>💰 Oferta: ${s.precio_oferta}</p>
                        <p>📝 ${s.mensaje_respuesta}</p>
                    </div>
                ` : `
                    <div class="input-group">
                        <input type="text" id="precio-${s.id}" placeholder="💰 Tu oferta (Ej: 5000 o ACEPTADO)">
                        <textarea id="mensaje-${s.id}" rows="2" placeholder="📝 Mensaje para el cliente..."></textarea>
                        <button class="btn-responder" onclick="responderSolicitud(${s.id})">📤 Enviar respuesta</button>
                    </div>
                `}
            </div>
        `).join('');
    }
    
    window.verFoto = function(url) {
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        modal.style.display = 'flex';
        modalImg.src = url;
    };
    
    window.cerrarModal = function() {
        document.getElementById('modal').style.display = 'none';
    };
    
    // ===== FUNCIÓN CORREGIDA PARA ABRIR WHATSAPP =====
    window.responderSolicitud = async function(id) {
        const precio = document.getElementById(`precio-${id}`).value;
        const mensaje = document.getElementById(`mensaje-${id}`).value;
        
        if (!precio || !mensaje) {
            Swal.fire('Error', 'Completa la oferta y el mensaje', 'error');
            return;
        }
        
        const solicitud = solicitudes.find(s => s.id === id);
        const precioCliente = parseInt(solicitud.precio_cliente);
        const esAceptado = precio.toLowerCase() === 'aceptado';
        
        const ofertaTexto = esAceptado ? `Aceptamos tu precio de $${precioCliente.toLocaleString()} MXN` : `Te ofrecemos $${parseInt(precio).toLocaleString()} MXN`;
        
        await supabase
            .from('solicitudes')
            .update({
                estado: 'respondida',
                precio_oferta: ofertaTexto,
                mensaje_respuesta: mensaje,
                fecha_respuesta: new Date().toISOString()
            })
            .eq('id', id);
        
        const mensajeWhatsApp = `*JL PHONE BUYBACK*\n\nHola ${solicitud.nombre},\n\nRespuesta a tu solicitud #${solicitud.id}\n\n📱 ${solicitud.marca} ${solicitud.modelo}\n💰 Tu precio: $${precioCliente.toLocaleString()} MXN\n\n🎯 *Nuestra respuesta:* ${ofertaTexto}\n\n📝 *Mensaje:* ${mensaje}\n\n¡Esperamos tu respuesta! 🙌`;
        
        const telefonoLimpio = solicitud.telefono.replace(/\D/g, '');
        const whatsappUrl = `https://wa.me/52${telefonoLimpio}?text=${encodeURIComponent(mensajeWhatsApp)}`;
        
        // MÉTODO 1: Intentar abrir en nueva pestaña (funciona en la mayoría de navegadores)
        const ventana = window.open(whatsappUrl, '_blank');
        
        // MÉTODO 2: Si falla, mostrar un enlace para que el usuario haga clic manualmente
        if (!ventana || ventana.closed || typeof ventana.closed === 'undefined') {
            // Mostrar un SweetAlert con el enlace directo
            Swal.fire({
                title: '📱 Abrir WhatsApp',
                html: `Haz clic en el siguiente enlace para enviar el mensaje:<br><br>
                       <a href="${whatsappUrl}" target="_blank" style="color: #10b981; word-break: break-all;">Abrir WhatsApp</a><br><br>
                       <small>Si no se abre automáticamente, haz clic en el enlace</small>`,
                icon: 'info',
                confirmButtonText: 'Cerrar',
                confirmButtonColor: '#10b981'
            });
        } else {
            // Si se abrió correctamente, mostrar mensaje de éxito
            Swal.fire({
                title: '✅ Respuesta enviada',
                text: `Se abrió WhatsApp para contactar a ${solicitud.nombre}`,
                icon: 'success',
                confirmButtonColor: '#10b981'
            });
        }
        
        cargarSolicitudes();
    };
    
    document.querySelectorAll('.filtro-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            filtroActual = this.dataset.filtro;
            mostrarSolicitudes();
        });
    });
    
    loginBtn.addEventListener('click', loginAdmin);
    logoutBtn.addEventListener('click', logoutAdmin);
    checkSession();
});
</script>
</body>
</html>
